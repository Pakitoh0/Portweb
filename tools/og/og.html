<!doctype html>
<!--
  Plantilla de la imagen Open Graph (public/og.png, 1200x630).
  Para regenerarla: servir la raíz del repo por HTTP, abrir tools/og/og.html con Playwright a 1200x630 y hacer captura.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>og</title>
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2')
          format('woff2');
        font-weight: 700;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2')
          format('woff2');
        font-weight: 400;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        display: grid;
        grid-template-columns: 2fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 18px;
        padding: 56px 48px 40px;
        font-family: 'JetBrains Mono', monospace;
        color: #cdd6f4;
        background:
          radial-gradient(circle at 15% 10%, #cba6f72a, transparent 45%),
          radial-gradient(circle at 85% 90%, #89b4fa2a, transparent 45%), #11111b;
        position: relative;
      }
      .bar {
        position: absolute;
        top: 14px;
        left: 48px;
        right: 48px;
        height: 30px;
        border: 1px solid #313244;
        border-radius: 10px;
        background: #1e1e2e;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 14px;
        font-size: 14px;
        color: #7f849c;
      }
      .bar .on {
        background: #cba6f7;
        color: #11111b;
        border-radius: 6px;
        padding: 1px 8px;
        font-weight: 700;
      }
      .win {
        border: 2px solid #313244;
        border-radius: 14px;
        background: #1e1e2e;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .win.main {
        grid-row: span 2;
        border-image: linear-gradient(45deg, #cba6f7, #89b4fa, #a6e3a1) 1;
        border-radius: 0;
      }
      .title {
        padding: 8px 16px;
        border-bottom: 1px solid #313244;
        font-size: 14px;
        color: #7f849c;
        display: flex;
        justify-content: space-between;
      }
      .dots i {
        display: inline-block;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        margin-left: 6px;
      }
      .body {
        padding: 22px 26px;
        flex: 1;
      }
      .main .body {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .g {
        color: #a6e3a1;
      }
      .b {
        color: #89b4fa;
      }
      .m {
        color: #cba6f7;
      }
      .a {
        color: #f9e2af;
      }
      .s {
        color: #7f849c;
      }
      h1 {
        font-size: 92px;
        line-height: 1;
        margin: 18px 0 16px;
      }
      .role {
        font-size: 26px;
        color: #cba6f7;
      }
      .url {
        margin-top: 30px;
        font-size: 20px;
        color: #7f849c;
      }
      pre {
        font:
          16px/1.7 'JetBrains Mono',
          monospace;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="on">1:inicio</span><span>2:sobre-mí</span><span>3:proyectos</span
      ><span>4:herramientas</span><span>5:contacto</span>
    </div>
    <div class="win main">
      <div class="title">
        <span><span class="g">~</span>/hola</span
        ><span class="dots"
          ><i style="background: #f9e2af"></i><i style="background: #a6e3a1"></i
          ><i style="background: #f38ba8"></i
        ></span>
      </div>
      <div class="body">
        <div style="font-size: 22px"><span class="g">❯</span> <span class="b">whoami</span></div>
        <h1>Francisco</h1>
        <div class="role">Software Engineering Student</div>
        <div class="role">Junior Software Developer</div>
        <div class="url">pakitoh0.github.io/Portweb</div>
      </div>
    </div>
    <div class="win">
      <div class="title">
        <span><span class="g">~</span>/fetch</span>
      </div>
      <div class="body">
        <pre><span class="b">pacodev</span>@<span class="m">arch</span>
<span class="g">wm</span>    Hyprland
<span class="g">uni</span>   UMA
<span class="g">loc</span>   Málaga</pre>
      </div>
    </div>
    <div class="win">
      <div class="title">
        <span><span class="g">~</span>/stack</span>
      </div>
      <div class="body">
        <pre><span class="a">Java</span> · <span class="a">C#</span> · <span class="a">Python</span>
<span class="b">React</span> · <span class="b">Node</span> · <span class="b">.NET</span>
<span class="m">Playwright</span> · <span class="m">CI/CD</span></pre>
      </div>
    </div>
  </body>
</html>
