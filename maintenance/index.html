<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>En mantenimiento · portafolio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2311111b'/%3E%3Ctext x='5' y='22' font-family='monospace' font-size='16' fill='%23f9e2af'%3E&gt;_%3C/text%3E%3C/svg%3E" />
  <style>
    /* Página autónoma: no depende del build, así se puede publicar aunque la web esté rota */
    :root { --base:#11111b; --surface:#1e1e2e; --overlay:#313244; --text:#cdd6f4; --subtle:#7f849c;
            --green:#a6e3a1; --amber:#f9e2af; --blue:#89b4fa; --mauve:#cba6f7; --red:#f38ba8; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
           font-family:"JetBrains Mono", ui-monospace, monospace; color:var(--text);
           background: radial-gradient(circle at 15% 10%, #f9e2af14, transparent 40%), var(--base); }
    .window { width:min(640px,100%); border-radius:12px; overflow:hidden; background:var(--surface);
              border:2px solid var(--amber); box-shadow:0 25px 50px #0008; }
    .title { display:flex; justify-content:space-between; padding:8px 16px; font-size:12px;
             color:var(--subtle); border-bottom:1px solid var(--overlay); }
    .dots i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-left:6px; }
    .body { padding:20px; font-size:14px; line-height:1.7; }
    .g{color:var(--green)} .b{color:var(--blue)} .a{color:var(--amber)} .s{color:var(--subtle)} .r{color:var(--red)}
    h1 { font-size:clamp(1.6rem,6vw,2.4rem); margin:16px 0 8px; }
    .cursor::after { content:"▌"; color:var(--amber); animation:blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { .cursor::after { animation:none; } }
  </style>
</head>
<body>
  <main class="window">
    <div class="title">
      <span><span class="g">~</span>/mantenimiento</span>
      <span class="dots" aria-hidden="true"><i style="background:var(--amber)"></i><i style="background:var(--green)"></i><i style="background:var(--red)"></i></span>
    </div>
    <div class="body">
      <p><span class="g">❯</span> <span class="b">systemctl status portweb</span></p>
      <p><span class="a">●</span> portweb.service — portafolio<br>
         <span class="s">&nbsp;&nbsp;Active:</span> <span class="a">reloading (mantenimiento)</span></p>
      <h1>Vuelvo enseguida</h1>
      <p class="s">Estoy aplicando una corrección a la web. Vuelve a intentarlo en unos minutos.</p>
      <p class="cursor"><span class="g">❯</span> </p>
    </div>
  </main>
</body>
</html>
